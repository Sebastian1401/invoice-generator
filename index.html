<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Generator</title>
    <link rel="icon" href="data:,">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">
    <div id="app-container" class="w-full max-w-5xl bg-white shadow-lg rounded-lg p-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">Invoice Generator</h1>
        
        <div id="content-area" class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div id="form-section" class="bg-white border border-gray-200 p-6 rounded shadow-sm">
                <h2 class="text-xl font-semibold text-gray-700 mb-4 border-b pb-2">Invoice Details</h2>
                <form id="invoice-form" class="space-y-4">
                    
                    <div>
                        <label for="invoice-date" class="block text-sm font-medium text-gray-700">Date</label>
                        <input type="date" id="invoice-date" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
                    </div>

                    <div class="flex items-end gap-2 border-t border-b py-4 my-2">
                        <div class="flex-grow">
                            <label for="client-select" class="block text-sm font-medium text-gray-700">Client</label>
                            <select id="client-select" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border bg-gray-50">
                                <option value="">-- Select a saved client --</option>
                                </select>
                        </div>
                        <button type="button" id="btn-add-client" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md shadow-sm transition-colors text-sm">
                            + New Client
                        </button>
                    </div>

                    <div>
                        <label for="total-value" class="block text-sm font-medium text-gray-700">Total Value ($)</label>
                        <input type="text" id="total-value" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border" placeholder="3.000.000">
                    </div>

                    <div>
                        <label for="job-concept" class="block text-sm font-medium text-gray-700">Job Concept</label>
                        <textarea id="job-concept" rows="5" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border" placeholder="Describe the work done..."></textarea>
                    </div>

                </form>
            </div>
            
            <div id="preview-section" class="border border-gray-200 p-4 rounded bg-gray-50">
                <p class="text-gray-500 text-center">Invoice preview will go here</p>
            </div>
        </div>
    </div>

    <div id="client-modal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full flex items-center justify-center">
        <div class="bg-white p-6 border w-96 shadow-lg rounded-md">
            <h3 class="text-lg font-medium text-gray-900 mb-4 border-b pb-2">Add New Client</h3>
            <form id="new-client-form" class="space-y-4">
                <div>
                    <label for="new-client-name" class="block text-sm font-medium text-gray-700">Client Name / Company</label>
                    <input type="text" id="new-client-name" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border" required>
                </div>
                <div>
                    <label for="new-client-nit" class="block text-sm font-medium text-gray-700">NIT</label>
                    <input type="text" id="new-client-nit" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border" required>
                </div>
                <div class="flex justify-end gap-2 mt-6">
                    <button type="button" id="btn-cancel-client" class="bg-white text-gray-700 border border-gray-300 hover:bg-gray-50 font-medium py-2 px-4 rounded-md shadow-sm transition-colors text-sm">
                        Cancel
                    </button>
                    <button type="submit" id="btn-save-client" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md shadow-sm transition-colors text-sm">
                        Save Client
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
